name: Tests

# The stub-client test suites (tools/): run on every push to main and every pull request.
# They check logic, not looks; the in-game look still needs the real client.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Run every suite
        run: |
          status=0
          for suite in tools/test_*.lua; do
            echo "== $suite"
            lua5.4 "$suite" || status=1
          done
          exit $status
